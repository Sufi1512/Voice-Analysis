[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nexora-client"
version = "0.1.0.dev0"
description = "Python client for Nexora Voice Cloud (real-time voice processing for AI agents)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["websockets>=12", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_client"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["websockets", "websockets.*"]
ignore_missing_imports = true
