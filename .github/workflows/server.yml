name: server

# nexora-server (+ nexora-client): lint, types, tests, migrations on real PostgreSQL,
# Kubernetes manifest validation.

on:
  pull_request:
    paths: ["nexora-server/**", "nexora-client/**", "nexora-audio/src/**", "deploy/**",
            ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["nexora-server/**", "nexora-client/**", "nexora-audio/src/**", "deploy/**",
            ".github/workflows/server.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: nexora-server

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora" --health-interval 5s --health-retries 10
    env:
      NEXORA_TEST_POSTGRES_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          sudo apt-get install -y --no-install-recommends libopus0
          pip install -e ../nexora-audio -e ../nexora-client -e ".[dev,postgres,redis]"
      - name: Lint and types
        run: |
          ruff check src tests ../nexora-client/src
          ruff format --check src tests ../nexora-client/src
          mypy src ../nexora-client/src
      - name: Tests
        run: pytest -q
