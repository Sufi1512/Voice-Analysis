# Local / single-host deployment: server + PostgreSQL + Prometheus.
#   cp deploy/.env.example deploy/.env   # then edit the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 5s
      retries: 10

  nexora:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    depends_on:
      db: {condition: service_healthy}
    environment:
      NEXORA_DATABASE_URL: postgresql+psycopg://nexora:${POSTGRES_PASSWORD}@db:5432/nexora
      NEXORA_SECRET_KEY: ${NEXORA_SECRET_KEY:?set NEXORA_SECRET_KEY}
      NEXORA_ADMIN_API_KEY: ${NEXORA_ADMIN_API_KEY:?set NEXORA_ADMIN_API_KEY}
      NEXORA_DEPLOYMENT_MODE: ${NEXORA_DEPLOYMENT_MODE:-self_hosted}
      NEXORA_MAX_SESSIONS: ${NEXORA_MAX_SESSIONS:-}
    ports: ["8080:8080"]
    deploy:
      resources:
        limits: {cpus: "4", memory: 4g}

  prometheus:
    image: prom/prometheus:latest
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    depends_on: [nexora]

volumes:
  pgdata:
