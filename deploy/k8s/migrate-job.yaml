# Runs database migrations once per rollout (re-create the Job for each new image).
apiVersion: batch/v1
kind: Job
metadata:
  name: nexora-migrate
  labels:
    app.kubernetes.io/name: nexora-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: nexora-server
          command: ["nexora-server", "migrate"]
          envFrom:
            - configMapRef: {name: nexora-config}
            - secretRef: {name: nexora-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
