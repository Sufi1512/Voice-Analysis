# Scales on open calls per pod (needs prometheus-adapter with prometheus-adapter-rules.yaml),
# with CPU as a second signal. Scale-in is slow because each removed pod drains its calls.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexora-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexora-server
  minReplicas: 2
  maxReplicas: 50
  metrics:
    - type: Pods
      pods:
        metric: {name: nexora_active_sessions}
        target: {type: AverageValue, averageValue: "11"}  # 70% of NEXORA_MAX_SESSIONS=16
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Percent, value: 100, periodSeconds: 60}
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - {type: Pods, value: 1, periodSeconds: 120}
