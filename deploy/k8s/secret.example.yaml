# Not applied by kustomization.yaml. Create the real secret yourself, for example:
#   kubectl -n nexora create secret generic nexora-secrets \
#     --from-literal=NEXORA_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=NEXORA_ADMIN_API_KEY="$(openssl rand -base64 32)" \
#     --from-literal=NEXORA_DATABASE_URL="postgresql+psycopg://USER:PASSWORD@HOST:5432/nexora"
# Optional: --from-literal=NEXORA_STRIPE_API_KEY=sk_live_... (metered billing) and
#           --from-literal=NEXORA_OIDC_CLIENT_SECRET=... (dashboard single sign-on).
# Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: nexora-secrets
type: Opaque
stringData:
  NEXORA_SECRET_KEY: CHANGE_ME
  NEXORA_ADMIN_API_KEY: CHANGE_ME
  NEXORA_DATABASE_URL: CHANGE_ME
