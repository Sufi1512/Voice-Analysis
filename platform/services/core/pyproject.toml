[project]
name = "nexora-core"
version = "0.1.0"
description = "NEXORA Core: identity, organizations, workspaces, roles, audit and secrets"
readme = "README.md"
authors = [{ name = "Sufiyan Khan" }]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pyotp>=2.10.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nexora-core = "nexora_core.main:run"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
test = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "CPY001", "COM812", "ISC001", "ANN401", "TRY003", "EM101", "EM102", "FBT001", "FBT002"]

[tool.ruff.lint.per-file-ignores]
# tests: SQL built only from fixed table-name lists; transactions need several statements inside raises
"tests/**" = ["S101", "PLR2004", "ANN", "ARG001", "INP001", "S105", "S106", "S608", "E501", "PT012"]
"**/migrations/**" = ["INP001", "ANN", "E501"]  # SQL DDL reads better unwrapped

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = ["-q", "--cov=nexora_core", "--cov-report=term-missing:skip-covered", "--cov-fail-under=80"]

[tool.ty.environment]
python-version = "3.13"
