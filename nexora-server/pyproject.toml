[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nexora-server"
version = "0.1.0.dev0"
description = "Nexora Voice Cloud: multi-tenant real-time voice processing service (WebSocket + REST)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nexora-audio",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pyjwt>=2.8",
  "prometheus-client>=0.20",
  "websockets>=12",
  "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5"]
dev = [
  "pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "soundfile>=0.12", "scipy-stubs",
  "redis>=5", "fakeredis[lua]>=2.20", "kubernetes-validate>=1.30", "pyyaml>=6",
]

[project.scripts]
nexora-server = "nexora_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() defaults

[tool.ruff.lint.isort]
known-first-party = ["nexora_server"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["websockets", "websockets.*", "prometheus_client", "uvicorn"]
ignore_missing_imports = true
