<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora Voice Cloud</title>
  <link rel="stylesheet" href="/dashboard/static/app.css">
  <script type="module" src="/dashboard/static/app.js"></script>
</head>
<body>
  <header class="top">
    <span class="brand">Nexora Voice Cloud</span>
    <nav id="nav" hidden>
      <a href="#/overview">Overview</a>
      <a href="#/keys">API keys</a>
      <a href="#/profiles">Profiles</a>
      <a href="#/sessions">Sessions</a>
      <a href="#/team">Team</a>
      <a href="#/billing">Billing</a>
      <a href="#/audit">Audit log</a>
      <a href="#/orgs" data-superadmin>Organizations</a>
    </nav>
    <span class="who">
      <select id="org-pick" data-superadmin hidden aria-label="Organization"></select>
      <span id="who"></span>
      <button id="signout" class="link" hidden>Sign out</button>
    </span>
  </header>
  <main id="main">
    <section id="signin" class="card narrow" hidden>
      <h1>Sign in</h1>
      <p>Paste an API key with the <code>admin</code> scope. It is kept only in this browser tab.</p>
      <form id="signin-form">
        <label>API key <input id="signin-key" type="password" autocomplete="off" required></label>
        <button type="submit">Sign in</button>
        <p id="signin-error" class="error" role="alert"></p>
      </form>
      <p id="sso" class="muted" hidden><a id="sso-link" href="/auth/oidc/login">Sign in with SSO</a></p>
    </section>
    <section id="view"></section>
  </main>
</body>
</html>
